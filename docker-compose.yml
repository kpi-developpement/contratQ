version: '3.8'

services:
  backend:
    build:
      context: ./qualite
      dockerfile: Dockerfile
    container_name: contratq_backend_prod
    restart: unless-stopped
    ports:
      - "7623:7623" 
    environment:
      # 🛡️ THE SHIELD: Hna kan-goulou l'Backend y-hder m3a DB l-qdima li f l'serveur 
      - SPRING_DATASOURCE_URL=jdbc:postgresql://10.10.10.50:5432/kyntus_db
      - SPRING_DATASOURCE_USERNAME=kyntus_user
      - SPRING_DATASOURCE_PASSWORD=kyntus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=500MB
    deploy:
      resources:
        limits:
          memory: 1G 
    networks:
      - contratq-network

  frontend:
    build:
      context: ./qualite-frontend
      dockerfile: Dockerfile
      args:
        # L'Navigateur ghay-hder m3a l'IP d l'serveur
        - NEXT_PUBLIC_API_URL=${API_URL:-http://10.10.10.50:7623}
    container_name: contratq_frontend_prod
    restart: unless-stopped
    ports:
      - "8741:8741"
    environment:
      - PORT=8741
    depends_on:
      - backend
    networks:
      - contratq-network

networks:
  contratq-network:
    driver: bridge